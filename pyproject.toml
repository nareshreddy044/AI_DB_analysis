[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "db-monitor"
version = "0.1.0"
description = "Connect to a remote Oracle database"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "oracledb>=2.5.0",
  "python-dotenv>=1.0.0",
  "click>=8.1.0",
]

[project.scripts]
db-monitor = "db_monitor.cli:main"

[tool.setuptools.packages.find]
include = ["db_monitor*"]
